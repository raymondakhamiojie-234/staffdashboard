version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: falcus_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: falcus_staff_system
      MYSQL_USER: falcus_user
      MYSQL_PASSWORD: falcus_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always

volumes:
  mysql_data:
